<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Flats · Cronograma de montagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. TOKENS (mesma paleta do CRM Eccellenza: azul-ardósia escuro)
   ===================================================================== */
:root{
  --fundo:#0e131a; --coluna:#141c26; --sup:#1a2430; --sup2:#273545; --borda:#263444; --borda2:#2f3f51;
  --texto:#e6edf4; --suave:#b4bdc8; --fraco:#8f99a5;
  --marca:#3f74ec; --marca2:#5a89ef; --marca-lado:#254389; --marca-txt:#8aaaf0;
  --ok:#4fd184; --ok-suave:#14341f; --aviso:#f0b04a; --aviso-suave:#3a2c12; --alerta:#f2766f; --alerta-suave:#3b1c1f;
  --r-card:16px; --r-ctl:10px;
  --mola:cubic-bezier(.22,1,.36,1); --salto:cubic-bezier(.34,1.56,.64,1);
  --s-card:0 1px 2px rgb(0 0 0/.35),0 4px 16px rgb(0 0 0/.3);
  --s-flut:0 18px 40px rgb(0 0 0/.55),0 4px 10px rgb(0 0 0/.35);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);font-size:14px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60vw 55vh at 0% 0%,color-mix(in srgb,var(--marca) 16%,transparent),transparent 100%),
  radial-gradient(50vw 50vh at 100% 0%,color-mix(in srgb,var(--marca) 7%,transparent),transparent 100%),
  linear-gradient(165deg,color-mix(in srgb,var(--sup) 60%,var(--fundo)) 0%,var(--fundo) 55%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgb(138 170 240/.09) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--marca-txt);outline-offset:2px}

/* =====================================================================
   2. MOLDURA: topo, abas, área
   ===================================================================== */
.topo{position:sticky;top:0;z-index:30;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 28px;background:rgb(14 19 26/.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--borda)}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--marca-txt) 70%,transparent),transparent)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo b{display:block;font-size:14px;font-weight:700;letter-spacing:.3em;white-space:nowrap}
.logo span{display:block;font-size:11px;color:var(--fraco);letter-spacing:.08em;white-space:nowrap}
.abas{position:relative;display:flex;gap:2px;padding:4px;border-radius:12px;background:rgb(20 28 38/.8);border:1px solid var(--borda)}
.abas button{position:relative;z-index:1;height:36px;padding:0 16px;border-radius:9px;font-weight:600;font-size:13px;color:var(--suave);transition:color .2s}
.abas button:hover{color:var(--texto)}
.abas button.on{color:#fff}
.abas i{position:absolute;z-index:0;top:4px;height:36px;border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--marca) 78%,#000),var(--marca) 55%);box-shadow:inset 0 2px 1.5px rgb(0 0 0/.5),inset 0 -1px 0 rgb(255 255 255/.22),0 0 18px color-mix(in srgb,var(--marca) 45%,transparent);transition:left .42s var(--mola),width .42s var(--mola)}
.topo-dir{display:flex;justify-content:flex-end;align-items:center;gap:14px;color:var(--fraco);font-size:12px;white-space:nowrap}
.salvo{display:inline-flex;align-items:center;gap:6px}
.salvo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.salvo.pisca::before{animation:pisca .6s var(--mola)}
@keyframes pisca{0%{transform:scale(2.4)}100%{transform:scale(1)}}
.demo-faixa{background:linear-gradient(90deg,var(--aviso-suave),#4a3611,var(--aviso-suave));color:var(--aviso);text-align:center;padding:8px;font-weight:600;font-size:13px;border-bottom:1px solid #5a4418}
.demo-faixa button{margin-left:12px;text-decoration:underline;color:#fff;font-weight:600}
main{max-width:1440px;margin:0 auto;padding:22px 28px 60px}
.grade{display:grid;gap:18px}.grade>*{min-width:0}
.entra>*{animation:subir .6s var(--mola) both}
.entra>*:nth-child(2){animation-delay:.06s}.entra>*:nth-child(3){animation-delay:.12s}.entra>*:nth-child(4){animation-delay:.18s}.entra>*:nth-child(5){animation-delay:.24s}
@keyframes subir{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* =====================================================================
   3. PEÇAS: cartão, rótulo, botão, campo, selo
   ===================================================================== */
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--marca) 9%,transparent),transparent 56px),var(--coluna);border:1px solid var(--borda);border-radius:var(--r-card);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--marca-txt) 30%,transparent),var(--s-card);padding:20px}
.rot{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fraco)}
.card>.rot{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-ctl);font-weight:600;font-size:13px;background:var(--sup);border:1px solid var(--borda2);box-shadow:0 2px 0 #151d26,0 4px 6px rgb(0 0 0/.4),inset 0 1px 0 rgb(255 255 255/.07);transition:transform .12s var(--mola),box-shadow .12s,background .2s}
.btn:hover{background:var(--sup2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #151d26,0 1px 2px rgb(0 0 0/.4)}
.btn.pri{background:var(--marca);border-color:transparent;color:#fff;box-shadow:0 4px 0 var(--marca-lado),0 7px 10px color-mix(in srgb,var(--marca) 35%,transparent),inset 0 1px 0 rgb(255 255 255/.3)}
.btn.pri:hover{background:var(--marca2)}
.btn.pri:active{transform:translateY(4px);box-shadow:0 0 0 var(--marca-lado)}
.btn.perigo{color:var(--alerta)}
.btn.mini{height:30px;padding:0 11px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.campo{display:grid;gap:6px;font-size:12px;color:var(--suave);font-weight:500}
.campo input,.campo select{height:38px;padding:0 12px;border-radius:var(--r-ctl);background:#0d141f;border:1px solid var(--borda2);color:var(--texto);font-size:14px;width:100%;transition:border-color .2s,box-shadow .2s}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--marca);box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 30%,transparent)}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-ctl);background:#0d141f;border:1px solid var(--borda2)}
.seg button{height:30px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--suave);transition:all .2s var(--mola)}
.seg button.on{background:var(--marca);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--marca) 50%,transparent)}
.selo{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.selo.ok{background:var(--ok-suave);color:var(--ok)}.selo.av{background:var(--aviso-suave);color:var(--aviso)}.selo.al{background:var(--alerta-suave);color:var(--alerta)}.selo.nt{background:var(--sup2);color:var(--suave)}.selo.mc{background:#1b2a46;color:var(--marca-txt)}
.ponto{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.mudo{color:var(--fraco)} .dir{text-align:right}
.barra{height:6px;border-radius:99px;background:var(--sup2);overflow:hidden}
.barra>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--marca),var(--marca-txt));transition:width .8s var(--mola)}
.barra.ok>i{background:linear-gradient(90deg,#2fa866,var(--ok))}

/* =====================================================================
   4. ACOMPANHAMENTO
   ===================================================================== */
.veredito{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:var(--r-card);border:1px solid;font-size:15px;font-weight:500}
.veredito b{font-weight:700}
.veredito .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.veredito.ok{background:linear-gradient(90deg,var(--ok-suave),transparent 80%),var(--coluna);border-color:#1f5a36}.veredito.ok .ic{background:var(--ok);color:#06200f}
.veredito.av{background:linear-gradient(90deg,var(--aviso-suave),transparent 80%),var(--coluna);border-color:#5a4418}.veredito.av .ic{background:var(--aviso);color:#2a1c02}
.veredito.al{background:linear-gradient(90deg,var(--alerta-suave),transparent 80%),var(--coluna);border-color:#6a2a2a}.veredito.al .ic{background:var(--alerta);color:#2a0606}
.veredito.nt{background:linear-gradient(90deg,#1b2a46,transparent 80%),var(--coluna);border-color:#2b4170}.veredito.nt .ic{background:var(--marca);color:#fff}
.veredito .acoes{margin-left:auto;display:flex;gap:8px;flex:none}
.avisos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.topo-painel{grid-template-columns:minmax(380px,1fr) 2fr}
.heroi{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;overflow:hidden}
.heroi canvas{width:230px;height:230px;margin:-8px 0 -8px -14px}
.heroi .pct{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,var(--marca-txt));-webkit-background-clip:text;background-clip:text;color:transparent}
.heroi .pct small{font-size:26px;font-weight:700}
.heroi dl{display:grid;grid-template-columns:1fr auto;gap:5px 14px;margin-top:14px;font-size:13px}
.heroi dt{color:var(--suave)} .heroi dd{font-weight:700;text-align:right}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:126px}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--suave);letter-spacing:0;margin-left:4px}
.kpi .s{color:var(--suave);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.predio{display:grid;gap:5px}
.pav{display:grid;grid-template-columns:54px 1fr 150px 178px;align-items:center;gap:16px;padding:3px 8px;border-radius:10px;transition:background .2s}
.pav:hover{background:rgb(255 255 255/.03)}
.pav .n{font-weight:700;font-size:13px;color:var(--suave)}
.pav .n small{color:var(--fraco);font-weight:500}
.cels{display:grid;gap:5px;align-items:center}
.cel{position:relative;height:30px;border-radius:7px;font-size:11px;font-weight:600;color:var(--fraco);background:#111922;border:1px solid var(--borda);display:grid;place-items:center;transition:transform .18s var(--mola),border-color .2s,background .3s,color .3s;overflow:hidden}
.cel:hover{transform:translateY(-2px) scale(1.06);border-color:var(--marca-txt);color:#fff;z-index:2}
.cel.hall{letter-spacing:.14em;font-size:10px}
.cel.and{color:#fff;border-color:var(--c,var(--marca-txt));background:color-mix(in srgb,var(--c,var(--marca)) 20%,#111922)}
.cel.and::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 12px var(--c,var(--marca-txt));animation:pulso 1.8s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.25}50%{opacity:1}}
.cel.ok{color:#d8ffe7;background:linear-gradient(180deg,#24804d,#19603a);border-color:#3bb873;box-shadow:inset 0 1px 0 rgb(255 255 255/.25),0 0 10px rgb(79 209 132/.22)}
.cel.ok::before{content:"";position:absolute;left:0;bottom:0;height:3px;width:50%;background:#aef5c9}
.cel.ok.t1::before{left:50%}
.cel.pop{animation:pop .7s var(--salto)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.entra .cel{animation:surgecel .5s var(--mola) both;animation-delay:calc(var(--i)*9ms + 150ms)}
@keyframes surgecel{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.pav .pg{display:grid;grid-template-columns:1fr 40px;align-items:center;gap:10px;font-size:12px;font-weight:700}
.pav .pv{font-size:12px;color:var(--suave);text-align:right;white-space:nowrap}
.pav .pv b{color:var(--texto)}
.legenda{display:flex;gap:18px;font-size:12px;color:var(--suave);font-weight:500;letter-spacing:0;text-transform:none}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:14px;height:10px;border-radius:3px;border:1px solid var(--borda);background:#111922}
.baixo-painel{grid-template-columns:2fr 1fr}
.graf svg{display:block;width:100%;overflow:visible}
.graf .tr{stroke-dasharray:1;stroke-dashoffset:0}
.entra .graf .tr{animation:traco 1.6s var(--mola) .3s both}
@keyframes traco{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.rank{display:grid;gap:12px}
.rank .l{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:13px}
.rank .pos{font-weight:800;color:var(--fraco);text-align:center}
.rank .l.um .pos{color:var(--aviso)}
.rank .nm{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:5px}
.rank .vl{font-weight:700;text-align:right}
.rank .vl small{display:block;color:var(--fraco);font-weight:500;font-size:11px}

/* =====================================================================
   5. CRONOGRAMA (gantt por equipe)
   ===================================================================== */
.gantt{overflow:auto;max-height:calc(100vh - 230px);border-radius:12px;border:1px solid var(--borda);background:#0f151d}
.g-in{position:relative}
.g-head{position:sticky;top:0;z-index:5;height:52px;background:#121a24;border-bottom:1px solid var(--borda)}
.g-head .m,.g-head .d{position:absolute;white-space:nowrap}
.g-head .m{top:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--marca-txt);padding-left:6px}
.g-head .d{top:26px;height:26px;font-size:10px;color:var(--fraco);text-align:center;line-height:13px;border-left:1px solid var(--borda)}
.g-head .d.sg{border-left-color:var(--borda2)}
.g-head .d.hoje{color:#fff;font-weight:700;background:color-mix(in srgb,var(--marca) 40%,transparent)}
.g-row{position:relative;height:46px;border-bottom:1px solid rgb(38 52 68/.6)}
.g-nome{position:sticky;left:0;z-index:4;width:150px;height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:13px;background:#121a24;border-right:1px solid var(--borda);white-space:nowrap;overflow:hidden}
.g-head .g-nome{position:sticky;height:52px;font-size:11px}
.g-row.fora .g-nome{color:var(--fraco)}
.blk{position:absolute;top:8px;height:30px;border-radius:7px;font-size:10px;font-weight:700;display:grid;place-items:center;overflow:hidden;white-space:nowrap;border:1px solid var(--borda2);background:var(--sup);color:var(--suave);transition:transform .15s var(--mola)}
.blk:hover{transform:scaleY(1.12);z-index:3}
.blk.alt{background:#212d3b}
.blk.ok{background:linear-gradient(180deg,#24804d,#19603a);border-color:#3bb873;color:#d8ffe7}
.blk.and{background:color-mix(in srgb,var(--marca) 45%,#111922);border-color:var(--marca-txt);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--marca) 50%,transparent)}
.g-sem{position:absolute;top:52px;bottom:0;width:1px;background:rgb(47 63 81/.55)}
.g-hoje{position:absolute;top:26px;bottom:0;width:2px;background:var(--marca-txt);box-shadow:0 0 10px var(--marca-txt);z-index:3}

/* =====================================================================
   6. EQUIPES, SIMULADOR, CLIENTE, CONFIGURAÇÕES
   ===================================================================== */
.eqs{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.eq .cab{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eq .cab b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq.fora{opacity:.6}
.eq .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.eq .nums div{background:#111922;border:1px solid var(--borda);border-radius:10px;padding:10px 12px}
.eq .nums b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.eq .nums span{font-size:11px;color:var(--fraco)}
.eq .agora{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#111922;border:1px solid var(--borda);font-size:13px;margin-bottom:14px;min-height:54px}
.eq .rod{display:flex;gap:8px;justify-content:flex-end}
.nova{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:14px;align-items:end}
.sim{grid-template-columns:minmax(340px,1fr) 2fr;align-items:start}
.sim .res{margin-top:20px;padding:20px;border-radius:14px;background:#111922;border:1px solid var(--borda);text-align:center}
.sim .res .g{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,var(--marca-txt));-webkit-background-clip:text;background-clip:text;color:transparent}
.sim .res p{margin-top:8px;color:var(--suave)}
.sl{display:grid;grid-template-columns:96px 1fr 110px 130px;gap:14px;align-items:center;height:36px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:600}
.sl.meta{background:color-mix(in srgb,var(--ok) 10%,transparent);box-shadow:inset 0 0 0 1px #1f5a36}
.sl.atual{background:color-mix(in srgb,var(--marca) 14%,transparent);box-shadow:inset 0 0 0 1px #2b4170}
.sl .barra{height:10px}
.sl .barra.al>i{background:linear-gradient(90deg,#a84a45,var(--alerta))}
.tab{width:100%;border-collapse:collapse}
.tab th{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);text-align:left;padding:10px 14px;border-bottom:1px solid var(--borda)}
.tab td{padding:11px 14px;border-bottom:1px solid rgb(38 52 68/.6);font-size:14px}
.tab tr:last-child td{border-bottom:0}
.tab tbody tr{transition:background .2s}.tab tbody tr:hover{background:rgb(255 255 255/.03)}
.cli-cab{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.cli-cab h2{font-size:22px;letter-spacing:-.01em}
.cfg{grid-template-columns:1fr 1fr;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .tudo{grid-column:1/-1}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dias button{height:54px;border-radius:10px;background:#0d141f;border:1px solid var(--borda2);font-size:12px;font-weight:700;color:var(--fraco);display:grid;place-items:center;align-content:center;gap:2px;transition:all .2s var(--mola)}
.dias button small{font-weight:500;font-size:10px}
.dias button.m1{color:var(--aviso);border-color:#5a4418;background:var(--aviso-suave)}
.dias button.m2{color:#fff;border-color:var(--marca);background:#1b2a46}
.fer{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fer .selo button{color:inherit;font-weight:800;margin-left:2px}
.pavs-cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.pavs-cfg label{display:grid;gap:4px;font-size:11px;color:var(--fraco);font-weight:600}
.pavs-cfg input{height:36px;text-align:center;border-radius:9px;background:#0d141f;border:1px solid var(--borda2);font-weight:700;width:100%}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* =====================================================================
   7. FLUTUANTES: janela, dica, aviso
   ===================================================================== */
.veu{position:fixed;inset:0;z-index:50;background:rgb(6 9 13/.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:some .25s both}
@keyframes some{from{opacity:0}}

<body>
<header class="topo">
  <div class="logo"><canvas id="logo-esfera" width="72" height="72" style="width:36px;height:36px"></canvas><div><b id="nome-obra">GOLDEN FLATS</b><span>Cronograma de montagem · Eccellenza</span></div></div>
  <nav class="abas" id="abas"><i></i>
    <button data-aba="acomp">Acompanhamento</button><button data-aba="crono">Cronograma</button><button data-aba="equipes">Equipes</button>
    <button data-aba="simul">Simulador</button><button data-aba="cliente">Cliente</button><button data-aba="config">Configurações</button>
  </nav>
  <div class="topo-dir"><span id="hoje-txt"></span><span class="salvo" id="salvo">Salvo neste navegador</span></div>
</header>
<div id="demo-faixa"></div>
<main id="tela"></main>
<div id="flut"></div>
<div class="dica" id="dica"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   A. UTILITÁRIOS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }; // dia -> número
const dnIso = n => new Date(n * 864e5).toISOString().slice(0, 10);
const dsem = s => new Date(dn(s) * 864e5).getUTCDay();
const DS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fData = s => s ? s.slice(8) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const fCurta = s => s.slice(8) + '/' + s.slice(5, 7);
const fSem = s => DS[dsem(s)] + ', ' + fCurta(s);
const TURNO = ['manhã', 'tarde'];
const num = (v, dec = 0) => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const plural = (n, a, b) => n + ' ' + (Math.abs(n) === 1 ? a : b);
const CORES = ['#7ba3f0', '#4fd184', '#b697ee', '#f0a06a', '#4cc9ae', '#f08a8d', '#f2c84b', '#6cc7f5', '#e58fd0', '#a3d36a'];
const cor = e => CORES[(e.cor ?? 0) % CORES.length];
/** Hoje e o turno atual. `?hoje=2027-01-15` na barra de endereço simula outra data (para testar). */
function agora() {
  const q = new URLSearchParams(location.search).get('hoje'), d = new Date();
  const hoje = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { d: q || hoje, t: q ? 1 : (d.getHours() < 12 ? 0 : 1) };
}

/* =====================================================================
   B. ESTADO E GRAVAÇÃO (fica só neste navegador: localStorage)
   ===================================================================== */
const CHAVE = 'golden-flats-cronograma-v1';
function estadoPadrao() {
  let ini = dn(agora().d); while (new Date(ini * 864e5).getUTCDay() !== 1) ini++; // próxima segunda
  return {
    v: 1, conferido: false, backupEm: null, seq: 5,
    cfg: {
      nome: 'Golden Flats', inicio: dnIso(ini), prazo: '',
      aptoDias: 2,
      hallDias: 1,            // PROVISÓRIO: o Mateus ainda não definiu quanto leva um hall
      ordem: 'asc',           // asc = de baixo para cima
      semana: [0, 2, 2, 2, 2, 2, 0], // dom..sáb: 0 não trabalha, 1 só manhã, 2 dia inteiro
      feriados: [], margemCliente: 0, base: 'real',
    },
    // PROVISÓRIO: 232 aptos em 17 pavimentos (11 com 14 + 6 com 13). O Mateus corrige em Configurações.
    pavs: Array.from({ length: 17 }, (_, i) => ({ n: i + 1, q: i < 11 ? 14 : 13 })),
    equipes: [1, 2, 3, 4].map(i => ({ id: 'e' + i, nome: 'Equipe ' + i, tipo: 'fixa', cor: i - 1, ativa: true, entrada: '', pausas: [] })),
    feitos: {},  // id da unidade -> { d: data, t: 0 manhã | 1 tarde, e: id da equipe }
    fixos: {},   // id da unidade -> id da equipe (unidade reservada para uma equipe)
  };
}
function carregar() {
  try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s && s.cfg && s.pavs && s.equipes) return s; } catch (e) { }
  return estadoPadrao();
}
let S = carregar(), DEMO = false;
function salvar() {
  if (DEMO) return;
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) { toast('Não consegui salvar neste navegador. Faça um backup em Configurações.', true); }
  const el = $('#salvo'); el.classList.remove('pisca'); void el.offsetWidth; el.classList.add('pisca');
}

/* =====================================================================
   C. CALENDÁRIO: a obra é contada em TURNOS (manhã / tarde) de dias trabalhados
   ===================================================================== */
function criarCalendario(S) {
  const fer = new Set(S.cfg.feriados);
  let semana = S.cfg.semana; if (!semana.some(x => x)) semana = [0, 2, 2, 2, 2, 2, 0];
  let base = dn(S.cfg.inicio);
  for (const k in S.feitos) base = Math.min(base, dn(S.feitos[k].d));
  const slots = [], ords = [];
  for (let n = base; n < base + 1800; n++) {
    const d = dnIso(n), m = fer.has(d) ? 0 : semana[new Date(n * 864e5).getUTCDay()];
    if (m >= 1) { slots.push({ d, t: 0 }); ords.push(n * 2); }
    if (m === 2) { slots.push({ d, t: 1 }); ords.push(n * 2 + 1); }
  }
  const lb = o => { let a = 0, b = ords.length; while (a < b) { const m = (a + b) >> 1; ords[m] < o ? a = m + 1 : b = m; } return a; };
  return {
    slots, porSemana: semana.reduce((a, b) => a + b, 0),
    ini: (d, t = 0) => lb(dn(d) * 2 + t),        // instante em que o turno (d,t) começa
    fim: (d, t = 1) => lb(dn(d) * 2 + t + 1),    // instante em que o turno (d,t) termina
    em: T => slots[Math.max(0, Math.min(slots.length - 1, Math.ceil(T - 1e-6) - 1))], // turno em que o instante T cai
  };
}

/* =====================================================================
   D. MOTOR DE PREVISÃO
   ===================================================================== */
const PESO_PLANO = 2; // nas primeiras unidades a previsão ainda pesa o planejado (2 aptos de "crédito")

/** Junta tudo o que a previsão precisa: unidades, o que foi feito, ritmo de cada equipe. */
function contexto(S) {
  const cal = criarCalendario(S), A = S.cfg.aptoDias * 2, H = S.cfg.hallDias * 2;
  const pavs = [...S.pavs].sort((a, b) => S.cfg.ordem === 'asc' ? a.n - b.n : b.n - a.n);
  const unidades = [];
  for (const p of pavs) {
    for (let k = 1; k <= p.q; k++) unidades.push({ id: p.n + '-' + k, pav: p.n, tipo: 'apto', nome: p.n + String(k).padStart(2, '0'), peso: 1 });
    unidades.push({ id: p.n + '-H', pav: p.n, tipo: 'hall', nome: 'Hall ' + p.n + 'º', peso: H / A });
  }
  const porId = new Map(unidades.map(u => [u.id, u]));
  const ag = agora(), now = cal.ini(ag.d, ag.t), T0 = cal.ini(S.cfg.inicio, 0);
  const feito = new Map();
  for (const id in S.feitos) if (porId.has(id)) { const f = S.feitos[id]; feito.set(id, { ...f, T: cal.fim(f.d, f.t) }); }
  const st = {}; let somaT = 0, somaP = 0;
  for (const e of S.equipes) {
    const ini0 = Math.max(T0, e.entrada ? cal.ini(e.entrada, 0) : 0);
    const lista = [...feito].filter(([, f]) => f.e === e.id).map(([id, f]) => ({ u: porId.get(id), T: f.T })).sort((a, b) => a.T - b.T);
    const peso = lista.reduce((s, x) => s + x.u.peso, 0), ultimo = lista.length ? lista[lista.length - 1].T : 0;
    let parado = 0, voltou = 0;
    for (const p of e.pausas || []) {
      const a = cal.ini(p.de, 0), b = p.ate ? cal.ini(p.ate, 0) : Infinity;
      parado += Math.max(0, Math.min(b, ultimo) - Math.max(a, ini0));
      if (p.ate) voltou = Math.max(voltou, b);
    }
    const gasto = peso ? Math.max(peso, ultimo - ini0 - parado) : 0; // turnos trabalhados até a última conclusão
    somaT += gasto; somaP += peso;
    st[e.id] = { ini0, lista, peso, ultimo, gasto, bruto: peso ? gasto / peso : null, livre: Math.max(ini0, ultimo, voltou), aptos: lista.filter(x => x.u.tipo === 'apto').length, halls: lista.filter(x => x.u.tipo === 'hall').length };
  }
  const ritmoGeral = (PESO_PLANO * A + somaT) / (PESO_PLANO + somaP);
  for (const e of S.equipes) { const s = st[e.id]; s.ritmo = s.peso ? (PESO_PLANO * A + s.gasto) / (PESO_PLANO + s.peso) : ritmoGeral; }
  return { cal, A, H, unidades, porId, feito, st, now, T0, ag, ritmoGeral, brutoGeral: somaP ? somaT / somaP : null, ativos: S.equipes.filter(e => e.ativa), iniciou: ag.d >= S.cfg.inicio };
}

/**
 * Distribui o que falta entre as equipes, na ordem dos pavimentos: quem fica livre primeiro pega a próxima unidade.
 * lista = [{ id, ritmo (turnos por apto), livre (instante em que começou a unidade atual) }]
 */
function prever(c, lista, fixos) {
  const fila = c.unidades.filter(u => !c.feito.has(u.id));
  const plano = new Map();
  if (!fila.length) { let f = 0; c.feito.forEach(x => f = Math.max(f, x.T)); return { plano, fimT: f, pronto: true }; }
  if (!lista.length) return null;
  const reserva = {}, livres = [];
  for (const u of fila) { const e = fixos[u.id]; if (e && lista.some(x => x.id === e)) (reserva[e] = reserva[e] || []).push(u); else livres.push(u); }
  const eqs = lista.map(x => ({ ...x, t: x.livre, primeira: true }));
  let resta = fila.length, i = 0, fimT = 0;
  while (resta > 0) {
    let b = null; for (const e of eqs) if (!e.fora && (!b || e.t < b.t)) b = e;
    if (!b) break;
    const u = (reserva[b.id] && reserva[b.id].shift()) || livres[i++];
    if (!u) { b.fora = true; continue; }
    let fim = b.t + b.ritmo * u.peso;
    if (b.primeira) { fim = Math.max(fim, c.now + 1); b.primeira = false; } // a unidade em andamento não termina no passado
    plano.set(u.id, { u, eq: b.id, ini: b.t, fim }); b.t = fim; fimT = Math.max(fimT, fim); resta--;
  }
  return { plano, fimT };
}

/** Previsão com N equipes: mantém as mais rápidas de hoje e completa com equipes novas no ritmo médio da obra. */
function preverComN(c, S, N, entrada, base) {
  const ord = [...c.ativos].sort((a, b) => c.st[a.id].ritmo - c.st[b.id].ritmo).slice(0, N);
  const lista = ord.map(e => ({ id: e.id, ritmo: base === 'plano' ? c.A : c.st[e.id].ritmo, livre: c.st[e.id].livre }));
  const quando = Math.max(c.now, c.T0, entrada ? c.cal.ini(entrada, 0) : 0);
  for (let i = lista.length; i < N; i++) lista.push({ id: 'nova' + i, ritmo: base === 'plano' ? c.A : c.ritmoGeral, livre: quando });
  return prever(c, lista, S.fixos);
}
function equipesPara(c, S, alvo, entrada, base) {
  const alvoT = c.cal.fim(alvo, 1);
  for (let N = 1; N <= 60; N++) { const p = preverComN(c, S, N, entrada, base); if (p && p.fimT <= alvoT + 1e-6) return N; }
  return null;
}

/** Calcula tudo o que as telas mostram. */
let R = null;
function calcular() {
  const c = contexto(S), base = S.cfg.base;
  const lista = c.ativos.map(e => ({ id: e.id, ritmo: base === 'plano' ? c.A : c.st[e.id].ritmo, livre: c.st[e.id].livre }));
  const prev = prever(c, lista, S.fixos);
  const tot = c.unidades.length, feitas = c.feito.size;
  const aptosTot = c.unidades.filter(u => u.tipo === 'apto').length, aptosFeitos = [...c.feito.keys()].filter(id => c.porId.get(id).tipo === 'apto').length;
  const hallsTot = tot - aptosTot, hallsFeitos = feitas - aptosFeitos;
  const pesoResta = c.unidades.reduce((s, u) => s + (c.feito.has(u.id) ? 0 : u.peso), 0);
  // equipe -> unidade em que está agora
  const atual = {};
  if (prev) prev.plano.forEach(p => { if (!atual[p.eq] || p.ini < atual[p.eq].ini) atual[p.eq] = p; });
  const emAnd = new Map(); if (c.iniciou) for (const e in atual) emAnd.set(atual[e].u.id, e);
  // pavimentos
  const pav = {};
  for (const p of S.pavs) pav[p.n] = { n: p.n, tot: 0, feitos: 0, fimT: 0, and: false, incerto: false };
  for (const u of c.unidades) {
    const p = pav[u.pav]; p.tot++;
    if (c.feito.has(u.id)) { p.feitos++; p.fimT = Math.max(p.fimT, c.feito.get(u.id).T); }
    else if (prev && prev.plano.has(u.id)) { p.fimT = Math.max(p.fimT, prev.plano.get(u.id).fim); if (emAnd.has(u.id)) p.and = true; }
    else p.incerto = true;
  }
  const liberados = Object.values(pav).filter(p => p.feitos === p.tot).length;
  const proximo = Object.values(pav).filter(p => p.feitos < p.tot && !p.incerto).sort((a, b) => a.fimT - b.fimT)[0];
  const fim = prev && (prev.pronto || prev.plano.size) ? c.cal.em(prev.fimT) : null;
  const prazo = S.cfg.prazo, atraso = fim && prazo ? dn(fim.d) - dn(prazo) : null;
  // próximo dia de trabalho depois de hoje (quando uma equipe nova poderia começar)
  let prox = c.cal.slots[c.cal.ini(dnIso(dn(c.ag.d) + 1), 0)].d; if (prox < S.cfg.inicio) prox = S.cfg.inicio;
  const precisa = prazo && feitas < tot ? equipesPara(c, S, prazo, prox, base) : null;
  // ritmo recente (últimos 10 dias trabalhados) e ritmo necessário, em aptos por semana
  const jan = Math.min(c.cal.porSemana * 2, c.now - c.T0);
  let rec = 0; c.feito.forEach((f, id) => { if (f.T > c.now - jan) rec += c.porId.get(id).peso; });
  const ritmoRec = jan > 0 && feitas ? rec / jan * c.cal.porSemana : null;
  const turnosAtePrazo = prazo ? c.cal.fim(prazo, 1) - c.now : null;
  const ritmoNec = prazo && feitas < tot ? (turnosAtePrazo > 0 ? pesoResta / turnosAtePrazo * c.cal.porSemana : Infinity) : null;
  const capacidade = c.ativos.reduce((s, e) => s + c.cal.porSemana / (base === 'plano' ? c.A : c.st[e.id].ritmo), 0);
  // equipes sem concluir nada há tempo demais
  const paradas = c.iniciou ? c.ativos.filter(e => atual[e.id] && c.now - c.st[e.id].livre > c.st[e.id].ritmo * 1.5 + 1).map(e => ({ e, dias: Math.floor((c.now - c.st[e.id].livre) / 2) })) : [];
  R = { c, prev, tot, feitas, aptosTot, aptosFeitos, hallsTot, hallsFeitos, pct: tot ? feitas / tot * 100 : 0, pesoResta, atual, emAnd, pav, liberados, proximo, fim, prazo, atraso, prox, precisa, ritmoRec, ritmoNec, capacidade, turnosAtePrazo, paradas };
  return R;
}

/* =====================================================================
   E. AÇÕES (mudam o estado, gravam e redesenham)
   ===================================================================== */
function aplicar(msgFn, popId) {
  const antes = R && R.fim ? R.fim.d : null;
  salvar(); desenhar(false);
  if (popId) { const el = $(`[data-u="${popId}"]`); if (el) el.classList.add('pop'); }
  if (msgFn) {
    let m = msgFn();
    if (antes && R.fim && R.fim.d !== antes) { const d = dn(R.fim.d) - dn(antes); m += `<br><span class="mudo">Previsão de término: ${fData(R.fim.d)} (${d > 0 ? '+' : ''}${plural(d, 'dia', 'dias')})</span>`; }
    toast(m);
  }
}
const acoes = {
  concluir(id, d, t, e) { S.feitos[id] = { d, t, e }; delete S.fixos[id]; fecharJanela(); aplicar(() => `<b>${esc(R.c.porId.get(id).nome)}</b> concluído · ${fCurta(d)} ${TURNO[t]}`, id); },
  desfazer(id) { delete S.feitos[id]; fecharJanela(); aplicar(() => `Conclusão de <b>${esc(R.c.porId.get(id).nome)}</b> desfeita`); },
  reservar(id, e) { if (e) S.fixos[id] = e; else delete S.fixos[id]; fecharJanela(); aplicar(() => e ? `<b>${esc(R.c.porId.get(id).nome)}</b> reservado para ${esc(eq(e).nome)}` : 'Reserva retirada'); },
  novaEquipe(nome, tipo, entrada) {
    const usadas = new Set(S.equipes.map(e => e.cor)); let c = 0; while (usadas.has(c) && c < CORES.length) c++;
    S.equipes.push({ id: 'e' + (S.seq++), nome: nome || 'Equipe ' + (S.equipes.length + 1), tipo, cor: c % CORES.length, ativa: true, entrada, pausas: [] });
    aplicar(() => `Equipe <b>${esc(nome)}</b> entrou na obra. Cronograma reorganizado.`);
  },
  retirar(id) {
    const e = eq(id), temHist = Object.values(S.feitos).some(f => f.e === id);
    for (const u in S.fixos) if (S.fixos[u] === id) delete S.fixos[u];
    if (temHist) { e.ativa = false; (e.pausas = e.pausas || []).push({ de: agora().d, ate: null }); }
    else S.equipes = S.equipes.filter(x => x.id !== id);

/** Gráfico de avanço (SVG): unidades concluídas por data, a previsão e a linha do prazo. */

    cab += `<div class="d ${seg ? 'sg' : ''} ${s.d === c.ag.d ? 'hoje' : ''}" style="left:${X(i)}px;width:${larg}px">${DS[dsem(s.d)][0].toUpperCase()}<br>${s.d.slice(8)}</div>`;
    if (seg) grade += `<div class="g-sem" style="left:${X(i)}px"></div>`;
  }
  const eqs = [...S.equipes.filter(e => e.ativa), ...S.equipes.filter(e => !e.ativa && c.st[e.id].peso)];
  const linhas = eqs.map(e => {
    const s = c.st[e.id]; let ant = s.ini0, h = '';
    for (const x of s.lista) { const ini = Math.min(ant, x.T - 1), f = c.feito.get(x.u.id); h += blk('ok', ini, x.T, x.u, `${x.u.nome}\nConcluído ${fSem(f.d)} · ${TURNO[f.t]}`); ant = x.T; }
    if (prev && e.ativa) [...prev.plano.values()].filter(p => p.eq === e.id).forEach((p, k) => { const sl = c.cal.em(p.fim); h += blk(k === 0 && c.iniciou ? 'and' : p.u.pav % 2 ? '' : 'alt', Math.max(p.ini, k === 0 ? Math.min(p.ini, p.fim - 1) : p.ini), p.fim, p.u, `${p.u.nome}\nPrevisão: ${fSem(sl.d)} · ${TURNO[sl.t]}`); });
    return `<div class="g-row ${e.ativa ? '' : 'fora'}"><div class="g-nome"><i class="ponto" style="color:${cor(e)};background:${cor(e)}"></i>${esc(e.nome)}</div>${h}</div>`;
  }).join('');
  function blk(cls, ini, fim, u, dica) { const l = X(Math.max(ini, a)), w = Math.max(W - 2, X(fim) - l - 2); return `<button class="blk ${cls}" style="left:${l}px;width:${w}px" data-a="unidade" data-u="${u.id}" data-dica="${esc(dica)}">${w >= 26 ? (u.tipo === 'hall' ? 'H' + u.pav : u.nome) : ''}</button>`; }

    <p class="mudo" style="margin-top:12px">A distribuição é automática: a equipe que fica livre pega a próxima unidade, seguindo a ordem dos pavimentos. Ela se refaz sozinha a cada conclusão marcada e a cada equipe que entra ou sai.</p></div></div>`;
};

/* ---------- G3. Equipes ---------- */

/* ---------- G4. Simulador ---------- */
telas.simul = () => {
  const { c } = R, n = c.ativos.length, base = S.cfg.base;
  if (!sim.alvo) sim.alvo = R.prazo || (R.fim ? R.fim.d : c.ag.d);

  const linhas = []; let pior = 1;
  for (let N = 1; N <= max; N++) { const p = preverComN(c, S, N, sim.entrada, base), s = c.cal.em(p.fimT); linhas.push({ N, s, dias: dn(s.d) - dn(c.ag.d) }); }

/* =====================================================================
   H. DESENHO, JANELAS E EVENTOS
   ===================================================================== */
function desenhar(animar) {
  calcular();
  const tela = $('#tela'), rolagem = scrollY, gs = $('#gantt') ? $('#gantt').scrollLeft : null;
  tela.innerHTML = telas[aba]();
  if (!animar) $$('.entra', tela).forEach(e => e.classList.remove('entra'));
  if (aba === 'acomp') depoisAcomp();
  if (aba === 'crono') { const g = $('#gantt'); if (g) g.scrollLeft = gs != null && !animar ? gs : Math.max(0, $('#g-hoje').offsetLeft - 420); }
  if (animar) $$('[data-n]', tela).forEach(contar); else scrollTo(0, rolagem);
  $('#nome-obra').textContent = S.cfg.nome.toUpperCase(); document.title = S.cfg.nome + ' · Cronograma de montagem';
  $('#hoje-txt').textContent = fSem(R.c.ag.d) + '/' + R.c.ag.d.slice(0, 4);
  $('#salvo').textContent = DEMO ? 'Modo exemplo (não grava)' : 'Salvo neste navegador';
  $('#demo-faixa').innerHTML = DEMO ? '<div class="demo-faixa">MODO EXEMPLO · dados fictícios para você ver como fica. Nada aqui é gravado.<button data-a="demo">Sair do exemplo</button></div>' : '';
  $$('#abas button').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  const on = $('#abas button.on'), ind = $('#abas i'); ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px';
}
function contar(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fim = +el.dataset.n, dec = +(el.dataset.dec || 0), t0 = performance.now();
  const passo = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 4); el.textContent = num(fim * e, dec); if (k < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
function toast(html, erro) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; if (erro) t.style.borderLeftColor = 'var(--alerta)';
  $('#toasts').appendChild(t); setTimeout(() => { t.classList.add('sai'); setTimeout(() => t.remove(), 300); }, 4200);
}
function abrirJanela(html) { $('#flut').innerHTML = `<div class="veu" data-a="fechar-veu"><div class="janela" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#flut input, #flut button.pri'); if (f) f.focus(); }
function fecharJanela() { $('#flut').innerHTML = ''; }
function confirmar(titulo, texto, rotulo, fn, perigo) {

  $('#conf-ok').onclick = fn;
}
/** Janela da unidade: concluir (equipe, data, manhã ou tarde), reservar para uma equipe ou desfazer. */

  const lista = S.equipes.filter(e => e.ativa || e.id === sel || c.st[e.id].peso);
  const sl = pl && c.cal.em(pl.fim);
  abrirJanela(`<h3>${u.tipo === 'hall' ? esc(u.nome) : 'Apto ' + esc(u.nome)} <small>${u.pav}º pavimento</small></h3>
    <div>${f ? `<span class="selo ok">✓ Concluído ${fSem(f.d)} · ${TURNO[f.t]}</span>` : R.emAnd.has(id) ? `<span class="selo mc">Em montagem · previsão ${fSem(sl.d)} ${TURNO[sl.t]}</span>` : sl ? `<span class="selo nt">Previsão ${fSem(sl.d)} · ${TURNO[sl.t]}</span>` : '<span class="selo nt">Sem previsão</span>'}</div>
    <div class="campo">Equipe que montou<div class="chips" id="ju-eq">${lista.map(e => `<button type="button" class="${e.id === sel ? 'on' : ''}" style="--c:${cor(e)}" data-e="${e.id}"><i class="ponto" style="color:${cor(e)};background:${cor(e)}"></i>${esc(e.nome)}${e.ativa ? '' : ' (saiu)'}</button>`).join('') || '<span class="mudo">Cadastre uma equipe primeiro.</span>'}</div></div>
    <div class="form"><label class="campo">Concluído em<input type="date" id="ju-data" value="${f ? f.d : ag.d}" max="${ag.d}"></label>
      <div class="campo">Turno<div class="seg" id="ju-turno"><button type="button" class="${(f ? f.t : ag.t) === 0 ? 'on' : ''}" data-t="0">Manhã</button><button type="button" class="${(f ? f.t : ag.t) === 1 ? 'on' : ''}" data-t="1">Tarde</button></div></div></div>
    <div class="rod">${f ? `<button class="btn perigo" id="ju-desf">Desfazer conclusão</button>` : `<button class="btn" id="ju-res">${S.fixos[id] ? 'Tirar reserva' : 'Só reservar para a equipe'}</button>`}<button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" id="ju-ok" ${lista.length ? '' : 'disabled'}>${f ? 'Salvar' : 'Concluir'}</button></div>`);
  const troca = (box, attr) => $(box).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$(box + ' button').forEach(x => x.classList.toggle('on', x === b)); });
  troca('#ju-eq'); troca('#ju-turno');
  const esc2 = () => ($('#ju-eq .on') || {}).dataset?.e;
  $('#ju-ok').onclick = () => { const d = $('#ju-data').value; if (!d || d > ag.d) return toast('Escolha uma data até hoje.', true); acoes.concluir(id, d, +$('#ju-turno .on').dataset.t, esc2()); };
  if (f) $('#ju-desf').onclick = () => acoes.desfazer(id); else $('#ju-res').onclick = () => acoes.reservar(id, S.fixos[id] ? null : esc2());
}
function janelaEquipe(id) {
  const e = eq(id);
  abrirJanela(`<h3>Editar equipe</h3><label class="campo">Nome<input id="ee-nome" value="${esc(e.nome)}" maxlength="40"></label>
    <div class="form"><label class="campo">Tipo<select id="ee-tipo"><option value="fixa" ${e.tipo === 'fixa' ? 'selected' : ''}>Fixa da loja</option><option value="terceirizada" ${e.tipo !== 'fixa' ? 'selected' : ''}>Terceirizada</option></select></label>
    <label class="campo">Começou em (vazio = início da obra)<input type="date" id="ee-entrada" value="${e.entrada || ''}"></label></div>
    <div class="rod"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" id="ee-ok">Salvar</button></div>`);
  $('#ee-ok').onclick = () => acoes.editarEquipe(id, $('#ee-nome').value.trim(), $('#ee-tipo').value, $('#ee-entrada').value);
}

document.addEventListener('click', ev => {
  const ab = ev.target.closest('[data-aba]'); if (ab) { aba = ab.dataset.aba; scrollTo(0, 0); desenhar(true); return; }
  const b = ev.target.closest('[data-a]'); if (!b) return; const d = b.dataset;
  switch (d.a) {
    case 'fechar-veu': if (ev.target === b) fecharJanela(); break;
    case 'fechar': fecharJanela(); break;
    case 'unidade': janelaUnidade(d.u, d.e); break;
    case 'ir': aba = d.aba; desenhar(true); break;
    case 'gantt-hoje': $('#gantt').scrollTo({ left: Math.max(0, $('#g-hoje').offsetLeft - 420), behavior: 'smooth' }); break;
    case 'nova-equipe': { const n = $('#ne-nome').value.trim(); if (!n) { toast('Dê um nome para a equipe.', true); $('#ne-nome').focus(); break; } acoes.novaEquipe(n, $('#ne-tipo').value, $('#ne-entrada').value); break; }
    case 'editar-equipe': janelaEquipe(d.e); break;
    case 'retirar': { const e = eq(d.e); confirmar('Retirar ' + esc(e.nome) + '?', 'O cronograma é refeito com as equipes que ficam. O que ela já concluiu continua registrado e ela pode ser reativada depois.', 'Retirar da obra', () => acoes.retirar(d.e), true); break; }
    case 'reativar': acoes.reativar(d.e); break;
    case 'base': S.cfg.base = d.v; aplicar(); break;
    case 'ordem': S.cfg.ordem = d.v; aplicar(); break;
    case 'dia': S.cfg.semana[+d.i] = (S.cfg.semana[+d.i] + 1) % 3; aplicar(); break;
    case 'conferido': S.conferido = true; aplicar(() => 'Dados da obra conferidos.'); break;
    case 'fer-add': { const v = $('#fer-data').value; if (v && !S.cfg.feriados.includes(v)) { S.cfg.feriados.push(v); aplicar(); } break; }
    case 'fer-del': S.cfg.feriados = S.cfg.feriados.filter(x => x !== d.d); aplicar(); break;
    case 'fer-nac': { for (const f of ['2026-11-20', '2026-12-25', '2027-01-01', '2027-03-26', '2027-04-21', '2027-05-01', '2027-09-07', '2027-10-12', '2027-11-02', '2027-11-15', '2027-11-20', '2027-12-25']) if (!S.cfg.feriados.includes(f)) S.cfg.feriados.push(f); aplicar(() => 'Feriados nacionais adicionados. Carnaval, Corpus Christi e feriados locais você adiciona à mão.'); break; }
    case 'pav-add': S.pavs.push({ n: Math.max(0, ...S.pavs.map(p => p.n)) + 1, q: S.pavs[S.pavs.length - 1]?.q || 14 }); aplicar(); break;
    case 'pav-del': { const p = S.pavs[S.pavs.length - 1]; if (Object.keys(S.feitos).some(k => k.startsWith(p.n + '-'))) { toast('Esse pavimento já tem unidade concluída. Desfaça as conclusões antes.', true); break; } S.pavs.pop(); aplicar(); break; }
    case 'backup': { S.backupEm = agora().d; salvar(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = `backup-golden-flats-${agora().d}.json`; a.click(); desenhar(false); toast('Backup baixado. Guarde o arquivo em lugar seguro.'); break; }
    case 'restaurar': $('#arq').click(); break;
    case 'zerar': confirmar('Zerar tudo?', 'Apaga todas as conclusões, equipes e configurações deste navegador. Não tem volta. Baixe um backup antes.', 'Apagar tudo', () => { S = estadoPadrao(); fecharJanela(); aplicar(() => 'Tudo zerado.'); }, true); break;
    case 'demo': DEMO = !DEMO; S = DEMO ? estadoExemplo() : carregar(); sim.alvo = sim.entrada = ''; aba = DEMO ? 'acomp' : aba; desenhar(true); break;
    case 'imprimir': print(); break;
    case 'copiar-cliente': navigator.clipboard.writeText(textoCliente()).then(() => toast('Texto copiado. Confira antes de enviar ao cliente.'), () => toast('Não consegui copiar neste navegador.', true)); break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.cfg) {
    const k = t.dataset.cfg; let v = t.value;
    if (t.type === 'number') { v = Math.max(+t.min || 0, Math.min(+t.max || 99, +v || 0)); }
    if (k === 'inicio' && !v) return desenhar(false);
    if (k === 'nome' && !v.trim()) v = 'Golden Flats';
    S.cfg[k] = v; aplicar();
  } else if (t.dataset.pav != null) {
    const p = S.pavs[+t.dataset.pav], q = Math.max(0, Math.min(40, Math.round(+t.value || 0)));
    const maior = Math.max(0, ...Object.keys(S.feitos).filter(k => k.startsWith(p.n + '-') && !k.endsWith('H')).map(k => +k.split('-')[1]));
    if (q < maior) { toast(`O ${p.n}º pavimento já tem o apto ${p.n}${String(maior).padStart(2, '0')} concluído.`, true); return desenhar(false); }
    p.q = q; aplicar();
  } else if (t.dataset.sim) { sim[t.dataset.sim] = t.value; desenhar(false); }
  else if (t.id === 'arq' && t.files[0]) {
    t.files[0].text().then(txt => { const n = JSON.parse(txt); if (!n.cfg || !n.pavs || !n.equipes || !n.feitos) throw 0;
      confirmar('Restaurar este backup?', `O backup tem ${Object.keys(n.feitos).length} unidades concluídas e ${n.equipes.length} equipes. Ele substitui tudo o que está neste navegador.`, 'Restaurar', () => { DEMO = false; S = n; fecharJanela(); aplicar(() => 'Backup restaurado.'); });
    }).catch(() => toast('Esse arquivo não é um backup válido.', true));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharJanela(); });
// dica ao passar o mouse
const dica = $('#dica');
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-dica]'); if (!el) return dica.classList.remove('on'); dica.textContent = el.dataset.dica; const r = el.getBoundingClientRect(); dica.classList.add('on');
  const w = dica.offsetWidth, h = dica.offsetHeight; dica.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; dica.style.top = (r.top - h - 8 < 70 ? r.bottom + 8 : r.top - h - 8) + 'px'; });
let tRes; addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(() => desenhar(false), 150); });

/* =====================================================================
   I. DADOS DE EXEMPLO (só para ver como fica; nunca são gravados)
   ===================================================================== */
function estadoExemplo() {
  const E = estadoPadrao(), hoje = dn(agora().d); let ini = hoje - 45; while (new Date(ini * 864e5).getUTCDay() !== 1) ini--;
  E.conferido = true; E.cfg.inicio = dnIso(ini); E.cfg.prazo = dnIso(hoje + 60);
  const ritmos = [3.3, 3.9, 4.5, 3.6, 5.2, 4.1];
  E.equipes = ritmos.map((r, i) => ({ id: 'e' + (i + 1), nome: i < 4 ? 'Equipe ' + (i + 1) : 'Terceirizada ' + 'AB'[i - 4], tipo: i < 4 ? 'fixa' : 'terceirizada', cor: i, ativa: true, entrada: i < 4 ? '' : dnIso(ini + 14), pausas: [] }));
  E.seq = 7;
  let sem = 7; const rnd = () => { sem = (sem * 1103515245 + 12345) % 2147483648; return sem / 2147483648; };
  const c = contexto(E), fila = [...c.unidades], t = E.equipes.map(e => c.st[e.id].ini0);
  for (;;) { let k = 0; for (let i = 1; i < t.length; i++) if (t[i] < t[k]) k = i;
    const u = fila[0]; if (!u) break; const fim = t[k] + ritmos[k] * u.peso * (.8 + rnd() * .45); if (fim > c.now - .5) break;
    fila.shift(); const s = c.cal.em(fim); E.feitos[u.id] = { d: s.d, t: s.t, e: E.equipes[k].id }; t[k] = fim; }
  return E;
}

/* =====================================================================
   J. INÍCIO
   ===================================================================== */
Esfera.criar(); logoEsfera(); desenhar(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => desenhar(false));
</script>
