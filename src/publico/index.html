<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Golden Flats · Cronograma de montagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/moldura.css">
<link rel="stylesheet" href="/css/pecas.css">
<link rel="stylesheet" href="/css/telas.css">
<link rel="stylesheet" href="/css/flutuantes.css">
<link rel="stylesheet" href="/css/responsivo.css">
</head>
<body>
<header class="topo">
  <div class="logo"><canvas id="logo-esfera" width="72" height="72" style="width:36px;height:36px"></canvas><div><b id="nome-obra">GOLDEN FLATS</b><span>Cronograma de montagem · Eccellenza</span></div></div>
  <nav class="abas" id="abas"><i></i>
    <button data-aba="acomp">Acompanhamento</button><button data-aba="crono">Cronograma</button><button data-aba="equipes">Equipes</button>
    <button data-aba="simul">Simulador</button><button data-aba="cliente">Cliente</button><button data-aba="ativ">Atividades</button><button data-aba="config">Configurações</button>
  </nav>
  <div class="topo-dir"><span id="hoje-txt"></span><span class="salvo" id="salvo">Carregando…</span><b id="usuario-txt" style="color:var(--texto)"></b><button class="btn mini" data-a="sair">Sair</button></div>
</header>
<div id="demo-faixa"></div>
<main id="tela"></main>
<div id="flut"></div>
<div class="dica" id="dica"></div>
<div class="toasts" id="toasts"></div>
<script type="module" src="/js/app.js"></script>

</html>
